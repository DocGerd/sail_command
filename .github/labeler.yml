# Path -> area: label map for actions/labeler (see .github/workflows/labeler.yml).
# Label names and scope come from the taxonomy in CONTRIBUTING.md; keep both in
# sync if the taxonomy changes. Multiple labels can apply to one PR — a file
# that's genuinely dual-purpose (e.g. vite.config.ts) is intentionally listed
# under more than one area below.
#
# Deliberately left OUT of every area (verified cross-cutting / generic by
# reading the file and, for the two non-obvious cases, its importers — not
# just "hard to classify"): UI primitives (Button, Card, Chip, Disclosure,
# Field, NumberInput, Skeleton), AboutDialog/ChangelogView + lib/changelog.ts,
# Banner (generic info/warning/error banner, no PWA-specific logic), AppState
# (the umbrella container: Settings + Plan + Rig + activeLegIndex together —
# assigning it one area would misrepresent it), App.tsx/main.tsx, i18n dict
# files, lib/format.ts and lib/geo.ts (both confirmed by grepping importers:
# format.ts is used by both map components (DepthProfile, RouteLayer) and
# routing components (PlannerPanel, PlansList, RouteSummary); geo.ts by
# routing (isochrone/mask/polar/wind/replan), map (BoatMarker/ScaleBar/
# mapOrientation/routeCorridor) AND ais (aisGeoJson/projectionVector) — a
# genuine 3-area shared utility, not a routing file hiding as "generic"),
# lib/copyrightHolder (test-only, no source file), usePersistedToggle (a
# generic keyed localStorage-backed toggle, reused by unrelated overlays) /
# usePrefersReducedMotion/useWideLayout, test/fixtures.ts, test/setup.ts,
# types.ts, vite-env.d.ts, app.css.

