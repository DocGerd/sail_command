name: Coverage

# #319/#342: standalone reporting-only workflow, deliberately separate from
# ci.yml — same shape as python-lint.yml's separation (#220). The `app` and
# `e2e` jobs in ci.yml are the ONLY required checks under the protect-main
# ruleset (strict up-to-date policy); this job is NOT added to that ruleset,
# so it must fail closed (report a red job) without ever blocking a merge.
# `thresholds.statements: 80` lives in app/vite.config.ts's coverage block
# and only fires when coverage is enabled — this workflow is what enables it.
#
# Trigger: NIGHTLY (`schedule`) + `workflow_dispatch`, deliberately not
# `pull_request`/`push`. #319 asks for a REPORTING step, not a gate, and the
# full v8-instrumented suite is a multi-hundred-minute run (per-file audit
# in #1504's PR body) — nightly gets that cost off every PR's critical path
# entirely, at zero PR runner time. `paths:` is deliberately absent —
# meaningless for a schedule (there is no diff to filter), and NOT scoping
# to `app/**` also means a PR touching only this workflow file still gets
# covered by the next nightly run rather than needing its own trigger.
#
# #1504: the routing closure (`src/routing/realmask.repro.*.test.ts` and
# neighbours) grew enough test files that the whole suite, run as ONE
# unsharded job, started missing the 240-min `test:coverage` step cap
# (227/228/240-capped min across three consecutive nights; the last GREEN
# full run — 09-24, run 35970316715 — still needed 7099s = 118.3 min, and a
# single file, `realmask.repro.confinedDominance.test.ts`, accounted for
# 3692-8159s of that by itself depending on runner contention). Rather than
# raising the cap toward the GitHub-hosted job ceiling (360 min — no margin
# left once the suite grows further), this workflow now SHARDS the coverage
# run across `coverage-shard` matrix jobs using vitest's own `--shard=i/N`
# (the same sequencer ci.yml's `app-shard` already relies on,
# `SlowFileFirstSequencer` in app/vite.config.ts, which round-robins the
# SLOW_TEST_FILES_FIRST files across shards by array position) plus
# `--reporter=blob` (vitest 4's per-shard coverage+test blob report,
# `.vitest-reports/blob-<i>-<N>.json`), and a `coverage-merge` job that
# downloads every shard's blob and runs `vitest run --merge-reports` to
# combine them into the final coverage report + lcov upload. This is
# standard Vitest sharded-coverage support (@vitest/coverage-v8's
# `mergeReports`), not a bespoke mechanism.
on:
  schedule:
    # 02:17 UTC daily — deliberately off the hour and staggered from the
    # existing weekly schedules (scorecard.yml 03:30 Mon, codeql.yml 04:23
    # Mon) so a nightly coverage run never queues behind them.
    - cron: '17 2 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  # #879: the skip-gate step queries this workflow's own run history
  # (`gh api .../actions/workflows/coverage.yml/runs`) to find the last
  # successful run on `develop`. That lookup needs `actions: read` - without
  # it the call 403s, which the gate script treats as an API error and fails
  # open (runs in full), so a missing scope here is safe but silently
  # defeats the whole point of #879 rather than erroring loudly.
  actions: read
concurrency:
  # No `pull_request` trigger exists on this workflow (see `on:` above), so
  # nothing here is ever superseded — same-ref reruns queue rather than
  # cancel, which is correct when nothing is waiting on the result.
  group: coverage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # #1504: the skip-gate decision now lives in its own job (mirroring
  # ci.yml's `changes` job) so every `coverage-shard` matrix leg and the
  # `coverage-merge` job can read ONE decision via `needs.gate.outputs`
  # instead of each re-running (and each independently re-querying the
  # GitHub API for) the #879 gate.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_coverage: ${{ steps.gate.outputs.run_coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # #879: 7 of 29 sampled nights re-measured a byte-identical `develop`
      # tree at ~4125s mean job duration - ~8h of runner time over 29 days.
      # This step decides whether the expensive steps below run at all; the
      # JOB itself always runs and reports (never gated at the workflow
      # `on:`/job level), matching ci.yml's `e2e` docs-only-classify shape.
      # POLARITY: the safe default is RUN, never skip - see
      # `.github/scripts/coverage-skip-gate.sh`'s own header for the full
      # decision table and why every ambiguous input resolves to run=true.
      - name: Decide whether tonight's run is needed (#879)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/coverage-skip-gate.sh
  # #1504: vitest across N runners, sharded the same way ci.yml's
  # `app-shard` already is. `SlowFileFirstSequencer.shard()`
  # (app/vite.config.ts) spreads SLOW_TEST_FILES_FIRST round-robin across
  # `--shard=i/N`; every other file splits by BaseSequencer's path hash.
  # `--coverage.thresholds.statements=0` is REQUIRED on every shard run:
  # @vitest/coverage-v8's `generateReports` checks thresholds on EVERY
  # report generation regardless of `allTestsRun`, and a single shard only
  # ever exercises a FRACTION of the source tree, so the real 80% threshold
  # (app/vite.config.ts) would fail almost every shard even when the suite
  # as a whole is well covered. The real threshold is enforced once, in
  # `coverage-merge`, against the MERGED coverage map (where
  # `allTestsRun: true`) — not skipped, just deferred to where it is
  # meaningful.
  coverage-shard:
    name: coverage-shard (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: gate
    runs-on: ubuntu-latest
    # #1504 DERIVATION (mirrors the retired single-job comment this replaces
    # — see `app/src/test/timeoutBudgetVsJobCap.test.ts` for the guard that
    # keeps these two numbers, and the sufficient-bound arithmetic, in
    # sync): the STEP cap must stay strictly greater than the largest
    # `solverTimeoutMs(...)` product in the suite (900_000ms *
    # COVERAGE_MULTIPLIER_WHEN_ENABLED(8) = 120 min) PLUS a conservative
    # rest-of-shard wall-time allowance. No per-shard wall time has been
    # measured yet (this is the fix that introduces sharding), so the
    # allowance conservatively reuses the last known-GREEN UNSHARDED full
    # suite's measured wall time (7099s = 118.3 min, run 35970316715,
    # 2026-09-24) as a supremum: any one shard's subset of the suite cannot
    # take longer than the whole suite did on equivalent hardware. 120 +
    # 118.3 = 238.3 min minimum; 260/280 (step/job) leaves ~22/42 min of
    # additional margin on top of that supremum, which is itself already
    # conservative — real per-shard wall time is expected far below this
    # (the audited worst single file, confinedDominance, alone accounted
    # for 62-136 min depending on contention). There is no PR-latency cost
    # to over-provisioning a nightly, so this stays loose rather than
    # fitted to a real per-shard measurement that doesn't exist yet.
    timeout-minutes: 280
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults: { run: { working-directory: app } }
    env:
      SKIP: ${{ needs.gate.outputs.run_coverage == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SKIP != 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        if: env.SKIP != 'true'
      - name: Run npm run test:coverage (shard)
        id: test-coverage
        if: env.SKIP != 'true'
        run: >-
          npm run test:coverage -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=blob --coverage.thresholds.statements=0
        # See the job-level comment above for the derivation. Twin comment:
        # `app/src/test/timeoutBudgetVsJobCap.test.ts`'s `JOB_CAP_MINUTES`
        # constant MUST equal this number — change both together (#359's
        # documented coupling, unchanged by #1504's restructure beyond the
        # job id it addresses).
        timeout-minutes: 260
      - name: Upload coverage blob (${{ matrix.shard }})
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: app/.vitest-reports
          retention-days: 1
          if-no-files-found: error
  # #1504: reads every shard's blob (test results + raw v8 coverage) and
  # merges them via vitest's own `--merge-reports`, which regenerates the
  # configured reporters (text-summary/text/lcov, app/vite.config.ts) and
  # re-checks the real 80% threshold against the FULL merged coverage map
  # (`allTestsRun: true` there, unlike any individual shard). Runs no
  # tests itself, so it carries none of the per-test-timeout exposure the
  # `coverage-shard` job does — its cap is sized for
  # download+merge+report+upload only.
  coverage-merge:
    needs: [gate, coverage-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: app } }
    env:
      SKIP: ${{ needs.gate.outputs.run_coverage == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SKIP != 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        if: env.SKIP != 'true'
      - name: Download coverage blobs
        if: env.SKIP != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-blob-*
          path: app/.vitest-reports
          merge-multiple: true
      - name: Merge shard coverage reports
        id: merge-coverage
        if: env.SKIP != 'true'
        run: npm run test:coverage -- --merge-reports
      # #346: upload the lcov report (app/vite.config.ts's coverage.reporter
      # now includes 'lcov') to Codecov for the README badge. Deliberately
      # NOT added to the required `app`/`e2e` jobs in ci.yml — this step lives
      # only in this pre-existing NIGHTLY job, so the badge can lag `develop`
      # by up to ~24h and costs zero PR-critical-path minutes (the
      # alternative, a per-PR non-required job like hangarfit's, would add a
      # ~40+ min non-blocking job to every PR per this file's own coverage
      # timing comments above — not adopted here without a separate decision).
      # `fail_ci_if_error: true` is a DELIBERATE divergence from hangarfit's
      # `false`. It is NOT an application of CLAUDE.md's guard-asymmetry rule
      # ("a NUDGE should fail open") but a reasoned departure from it: that
      # rule assumes a fail-closed guard can cost someone a blocked merge, and
      # nothing here can block anything (this job is not in `protect-main`).
      # With no merge cost on either side, the remaining asymmetry is
      # VISIBILITY — a silent upload failure (missing/expired CODECOV_TOKEN, a
      # Codecov outage) leaves the README badge stale with no signal at all,
      # where a red job at least surfaces it. Stated plainly because this file
      # argues the other way in the `timeout-minutes: 280` comment above:
      # a permanently-red non-required check DOES get ignored. If this step
      # ever starts failing chronically, fix or remove it — do not flip this
      # to `false`.
      - name: Upload coverage to Codecov
        # #879: skipping must not upload a stale report over a fresh badge -
        # same gate as `npm ci`/the merge step above. When skipped there is
        # no `app/coverage/lcov.info` from THIS run anyway, so gating here is
        # belt-and-braces against uploading a leftover file from
        # actions/cache or a prior job attempt.
        if: env.SKIP != 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: app/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
