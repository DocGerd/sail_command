name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  # Cancel superseded runs on PRs only - `cancel-in-progress` here governs
  # only an already-RUNNING run, never a merely QUEUED one, so "pushes to
  # main/develop always run to completion" is an OVER-CLAIM (the same one
  # #900's review corrected in codeql.yml's twin comment): GitHub's
  # concurrency semantics allow at most ONE `pending` run per group
  # regardless of `cancel-in-progress` - "When a new job or workflow run is
  # queued, any existing pending job or workflow run in the same group is
  # canceled and replaced" (github/docs, using-concurrency.md, quoted
  # verbatim, not paraphrased). So two pushes to the SAME branch queued
  # close together (this group is `ci-${{ github.ref }}`, branch-specific
  # for push events) can drop the earlier-queued one before it ever starts,
  # even though push events never set `cancel-in-progress: true`. See
  # CLAUDE.md's own `ci.yml`'s concurrency group bullet for the measured
  # same-ref queuing/wedge behavior this composes with.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  app:
    runs-on: ubuntu-latest
    # #882: this job had NO cap (GitHub's 360-minute default) until now. Sized
    # generously rather than tightly: re-measured 2026-09-03 via the Actions
    # API against the 30 most recent `ci.yml` runs, `app`'s max is 1557s
    # (25.95 min, n=29 completed) — consistent with #882's own 1551s figure
    # from a day earlier. #878 (same milestone, in flight) is SPLITTING
    # `routing/realmask.repro.test.ts`, the one file that dominates this
    # job's wall clock (CLAUDE.md's "Full test suite" bullet), which will
    # change this duration — so this cap is deliberately NOT tuned tight
    # against today's measurement (that would risk a false red the moment
    # #878 lands, or before it if a slow runner is hit). 45 min is close to
    # #882's own recommendation and leaves ~1.7x headroom over the measured
    # max; revisit once #878 has landed and the new duration is measured.
    timeout-minutes: 45
    defaults: { run: { working-directory: app } }
    # #875/#877: this job's two classify steps below need `checks: read` and
    # `actions: read` to read check-run/workflow-run state (the #877
    # skip-retest classifier) - the workflow-level `permissions: contents:
    # read` alone would leave those two unset (an explicit `permissions:`
    # block zeroes every unlisted scope), so this job declares its own,
    # REPLACING rather than adding to the workflow-level block.
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (#875/#877): the classify step below diffs a PR's
          # base against its head (needs both commits reachable), and the
          # #877 retest classifier walks a push commit's SECOND PARENT and
          # compares tree objects - a default depth-1 clone would make both
          # unreachable. Mirrors `e2e`'s own checkout, which already needed
          # this for the #327 classify step.
          fetch-depth: 0
      # Privacy guard (#474): fails the build if any tracked file leaks a
      # contributor's absolute home-directory path. Placed FIRST, before
      # `setup-node`/`npm ci`, since it needs neither (git + bash only) and
      # a leak is cheaper to catch before spending the rest of the job's
      # runtime. Wired into `app` rather than a new job because `app` is
      # one of the two REQUIRED status checks on `develop`/`main`
      # (`e2e` is the other) - a standalone job would report but not gate,
      # per this file's own `hook-selftests` job comment on that distinction.
      # Deliberately NOT wired into `e2e`: that job gates its expensive
      # steps behind a docs-only classify step, and docs are exactly where
      # this leaked (commit e5358d4) - skipping this check on a docs-only
      # PR would exempt the one path class it exists to cover. Overrides the
      # job's `app`-relative `defaults.run.working-directory` (same pattern
      # as the `e2e` job's classify step) because the leaks this guard
      # exists to catch were mostly OUTSIDE `app/` (`.claude/`, `CLAUDE.md`,
      # `docs/`) - scoping the scan to `app/` would miss most of what it's
      # for.
      - name: No leaked home paths (#474)
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/check-no-home-paths.sh
      # #875: docs-only vs. code classifier, same script `e2e` uses (#327),
      # but this step reads its OWN `run_app` output rather than `run_e2e` -
      # `run_app` is a STRICT SUBSET of `run_e2e`'s skip set (CHANGELOG.md
      # and changelog.d/* are excluded: they are build inputs baked into the
      # bundle at build time, and `app` running in full is exactly what
      # makes `e2e` skipping on them safe - see the script's own header and
      # CLAUDE.md's `ci.yml`'s `e2e` job bullet). The job still always runs
      # and always reports (`app` is a REQUIRED check) - only the expensive
      # steps below are `if:`-gated.
      - name: Classify change (docs-only vs. code) for app (#875)
        id: classify
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash -e .github/scripts/classify-docs-only.sh
      # #877: skip the expensive steps below when this push's TREE is
      # byte-identical to an already-tested PR head (a `develop`/`main` push
      # after a strict-up-to-date-policy merge always is - see the script's
      # own header for the full mechanism and the recursion guard). Applies
      # to `push` events only; every `pull_request` run gets `retest=true`
      # (run) immediately and is unaffected.
      - name: Classify skip-retest for app (#877)
        id: retest
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          CHECK_NAME: app
          GH_TOKEN: ${{ github.token }}
        run: bash -e .github/scripts/classify-retest.sh
      # The four `if:` gates below (and the two more on npm run notices/the
      # notices diff check) default to RUN unless BOTH classify steps
      # explicitly say `false` - matching #327's `!= 'false'` polarity on
      # both terms, so an absent/empty/errored output from EITHER step fails
      # this REQUIRED check's gate CLOSED, i.e. still runs the step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.classify.outputs.run_app != 'false' && steps.retest.outputs.retest != 'false'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        if: steps.classify.outputs.run_app != 'false' && steps.retest.outputs.retest != 'false'
      - run: npm run lint
        if: steps.classify.outputs.run_app != 'false' && steps.retest.outputs.retest != 'false'
      - run: npm run typecheck
        if: steps.classify.outputs.run_app != 'false' && steps.retest.outputs.retest != 'false'
      # #537: app/sweep/canonicalize.test.mjs guards a Critical defect (the
      # #54 rename-vs-solve-order coupling) but is never collected by vitest
      # (app/sweep/ is deliberately excluded from vite.config.ts's `include`
      # so the ~20 min #282 arm sweep never runs here - see the `app/sweep/`
      # bullet in CLAUDE.md). This step runs ONLY that one file under plain
      # Node (`node --test`), never `sweep/vitest.config.ts` - the expensive
      # nine-arm harness stays exclusively on-demand. Placed BEFORE `npm run
      # test` deliberately (PR #588 review, Minor 7): it completes in ~0.4s
      # (19 tests) against the full suite's ~500s, so a regression here
      # surfaces in seconds rather than ~8 minutes into the job.
      - run: npm run test:sweep-unit
        if: steps.classify.outputs.run_app != 'false' && steps.retest.outputs.retest != 'false'
      - run: npm run test
        if: steps.classify.outputs.run_app != 'false' && steps.retest.outputs.retest != 'false'
      - run: npm run build
        if: steps.classify.outputs.run_app != 'false' && steps.retest.outputs.retest != 'false'
      # Drift guard: a dependency bump that forgets to regenerate the
      # committed third-party notices fails CI. Pathspec is relative to the
      # job's working-directory (app/).
      - run: npm run notices
        if: steps.classify.outputs.run_app != 'false' && steps.retest.outputs.retest != 'false'
      - run: git diff --exit-code public/THIRD-PARTY-NOTICES.txt
        if: steps.classify.outputs.run_app != 'false' && steps.retest.outputs.retest != 'false'
  # Deliberately no `needs: app` edge. The e2e job is self-contained: its
  # `pree2e` hook rebuilds the app from scratch, so no artifact flows from the
  # `app` job. Running the two jobs concurrently rather than gated saves ~120s
  # of wall clock on every run, which compounds because `app`+`e2e` are both
  # required checks under a strict up-to-date branch policy — every merge in a
  # train pays a full CI cycle. Trade-off: a PR whose unit tests fail in `app`
  # now also burns e2e runner minutes instead of skipping them.
  # `app` and `e2e` also share an npm cache key (setup-node's `cache: npm` +
  # `cache-dependency-path: app/package-lock.json` above): now that the two
  # jobs start concurrently instead of `e2e` waiting on `app`, a
  # lockfile-changing PR may have `e2e` restore a cache miss (the two runners
  # race to populate the same cache key) and pay an uncached `npm ci`
  # (~5-6s). Accepted knowingly (#214) — the ~120s saved on every run
  # outweighs a few extra seconds on lockfile-changing PRs only.
  e2e:
    runs-on: ubuntu-latest
    # #605: with no cap this job inherited GitHub's 360-minute default, so a
    # wedged `npx playwright install --with-deps chromium` looked "healthy"
    # for hours instead of failing fast (32/54/65/90 min on PR runs, ~5h15m
    # once on a develop push - `ci.yml`'s push-runs-queue-behind-same-ref
    # concurrency group means one such wedge blocks every later develop push
    # too). Re-measured 2026-08-20 via the Actions API: the 8 most recent
    # real (non-docs-skip) `e2e` completions ordered by RUN CREATION time
    # (not job started_at, which lags creation under the same push-queue
    # behavior above) are 32353038925 (7m02s), 32335374485 (7m15s),
    # 32334063726 (7m26s), 32314957244 (7m10s), 32311732590 (7m06s),
    # 32311697344 (5m53s), 32303526023 (13m22s), 32301750085 (14m33s) -
    # range 5m53s-14m33s, worst case run 32301750085. An older completion
    # outside this window, run 32190387219 (2026-08-18, 16m43s), is also
    # cleared. 30 min clears the sampled worst case (14m33s) at ~2.06x and
    # the 16m43s outlier at ~1.79x, while still converting a silent
    # multi-hour wedge into a fast, obviously-retryable red (CLAUDE.md:
    # "tens of minutes, not hours"). This BOUNDS wedge damage, it does not
    # eliminate it: a wedge on a develop push still queue-blocks every later
    # develop push for up to this cap (same concurrency group as above), and
    # a human still has to notice the red and retry (`gh run cancel` /
    # `gh run rerun --failed`, per this file's own PWA/E2E/deploy section of
    # CLAUDE.md) - nothing here auto-retries.
    timeout-minutes: 30
    defaults: { run: { working-directory: app } }
    # #877: the skip-retest classify step below needs `checks: read` and
    # `actions: read` (see the identical job-level permissions comment on
    # `app`, above).
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the classify step below diffs the PR's base SHA
          # against its head SHA. A default depth-1 clone only holds the
          # merge-ref tip, so the base commit is unreachable and the diff
          # can't run — see the classify step's fail-closed default (#327).
          fetch-depth: 0
      # `e2e` is a REQUIRED status check under `protect-main` with a strict
      # up-to-date policy, so it must always run this job and always report
      # — a trigger-level `paths:`/`paths-ignore:` filter would make the
      # check never report at all on a skipped PR, blocking the PR forever.
      # Instead this classify step decides whether the PR's diff is
      # docs-only, and only the EXPENSIVE steps below are `if:`-gated on the
      # result; the job itself always completes and reports success (#327).
      - name: Classify change (docs-only vs. code) — fail-closed to RUN
        id: classify
        # Not under the job's `app`-relative default: path strings here must
        # stay unambiguously repo-root-relative to match the docs allowlist.
        working-directory: ${{ github.workspace }}
        # Pass templated context through env (not inlined into the script) so
        # nothing from the event payload is interpolated directly into a
        # shell command.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Extracted to .github/scripts/classify-docs-only.sh (#334) so the
        # decision logic carries committed test coverage (a 34-case adversarial
        # harness runnable offline via `--selftest`) instead of living only as
        # untested inline YAML shell — see that script's header for the full
        # rationale.
        #
        # `bash -e` here is LOAD-BEARING, not stylistic (PR #350 review,
        # Finding 1). GitHub's default `run:` shell already wraps the step in
        # `bash -e {0}`, but a bare `run: .github/scripts/classify-docs-only.sh`
        # execs the script via its own `#!/usr/bin/env bash` shebang, which
        # starts a NEW bash process — errexit is not inherited across that
        # exec (SHELLOPTS is not exported), so a failure inside the script
        # (e.g. `>> "$GITHUB_OUTPUT"` against an unwritable path) is silently
        # swallowed instead of aborting the step. Explicitly invoking
        # `bash -e <script>` runs the whole file under ONE interpreter with
        # `-e` set from the start, restoring the fail-closed semantics the
        # inline pre-extraction version had for free. This also makes the
        # script's own `--selftest` (which drives itself via `bash -e "$SELF"`)
        # an honest model of production instead of a stricter one.
        run: bash -e .github/scripts/classify-docs-only.sh
      # #877: same skip-retest classifier the `app` job runs, with
      # CHECK_NAME=e2e - see that job's identical step for the full
      # mechanism. `push` events only; every `pull_request` run is
      # unaffected (`retest=true` immediately).
      - name: Classify skip-retest for e2e (#877)
        id: retest
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          CHECK_NAME: e2e
          GH_TOKEN: ${{ github.token }}
        run: bash -e .github/scripts/classify-retest.sh
      # The four `if:` gates below default to RUN on anything OTHER than the
      # literal string 'false' — not `== 'true'` (PR #350 review, Finding 1).
      # An absent or empty `run_e2e`/`retest` output (a classify step
      # aborted before writing it, `GITHUB_OUTPUT` unwritable, any future
      # classifier bug) must fail this REQUIRED check's gate CLOSED, i.e.
      # still run e2e; an equality-on-'true' gate does the opposite — it
      # skips on anything that isn't exactly 'true', which includes "wrote
      # nothing at all". Both conditions must allow RUN for a step to be
      # skipped (#877 is additive to #327, never a replacement for it).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.classify.outputs.run_e2e != 'false' && steps.retest.outputs.retest != 'false'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        if: steps.classify.outputs.run_e2e != 'false' && steps.retest.outputs.retest != 'false'
      - run: npx playwright install --with-deps chromium
        if: steps.classify.outputs.run_e2e != 'false' && steps.retest.outputs.retest != 'false'
      - run: npm run e2e
        if: steps.classify.outputs.run_e2e != 'false' && steps.retest.outputs.retest != 'false'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
  # Non-required (#334; NOT added to `protect-main`'s required checks, same
  # treatment as the coverage job in #319 — and per `mergeable_state:
  # unstable`'s meaning in this repo, "only optional checks are red" is still
  # mergeable, so this job RUNS coverage and turns a broken selftest into a
  # visible red check, but does not itself GATE the merge). Several
  # `.claude/hooks/*.sh` scripts, and now `.github/scripts/classify-docs-only.sh`,
  # carry a `--selftest` mode with real coverage — but nothing ran any of them
  # automatically before this job, so a hook could be broken by an edit to a
  # DIFFERENT file (or an environment change) and every check would stay
  # green. Discovers scripts rather than hardcoding a list — a hardcoded list
  # silently misses the next hook added, the same enumerate-don't-patch
  # principle applied elsewhere in this repo to prose.
  hook-selftests:
    # #882: no cap before now (360-min default). Measured 2026-09-03 via the
    # Actions API against the 30 most recent runs: max 22s (n=30, all
    # success) — a "cheap insurance" job per #882's own bucket, sized at
    # 10-15 min rather than a tight multiple of a sub-minute median.
    timeout-minutes: 10
    # DO NOT add `defaults: { run: { working-directory: ... } }` to this job
    # (PR #350 review, pre-existing-but-now-relevant finding). This job has
    # no `defaults`, so its steps run at the checkout root — repo-root
    # relative paths like `.claude/hooks` resolve correctly, AND
    # `wind-fixture-guard.sh --selftest` (unrelated to this PR) is
    # cwd-sensitive: it reads `${CLAUDE_PROJECT_DIR:-.}/.claude/settings.json`
    # relative to `.`, so it only passes today because `.` happens to be the
    # repo root here. Setting a `working-directory` (e.g. `app`, to mirror
    # the `app`/`e2e` jobs) would silently turn that hook's selftest red
    # without touching a single line of its own logic - a landmine for the
    # next person who "tidies" this job to match the others.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Discover and run every --selftest suite
        run: |
          set -uo pipefail
          fail=0

          # Discover rather than hardcode (#334): both directories currently
          # hold hand-authored shell that is invoked by name from
          # `.claude/settings.json` or `ci.yml` respectively, and both are
          # small enough (5 files total today) that walking them on every
          # run costs nothing. `-maxdepth 1` deliberately does not recurse —
          # neither directory nests scripts today, and a future nested
          # script should be a conscious addition to this job, not a silent
          # pickup. `find -L` follows symlinks so a symlinked hook is
          # discovered like a real file (PR #350 review, Finding 7) —
          # plain `-type f` silently excludes a symlink even though it's
          # exactly the kind of "next hook added" this job exists to catch.
          #
          # Each directory is checked INDIVIDUALLY, not just the combined
          # result (PR #350 review, Finding 2): a bare
          # `find A B ... 2>/dev/null | sort` swallows `find`'s error when
          # ONE of the two directories is missing/renamed, and the surviving
          # directory alone keeps `$files` non-empty — so a zero-files guard
          # on the COMBINED list only fires when BOTH directories vanish at
          # once, silently running with partial coverage (e.g. 1 of 5
          # scripts) the rest of the time. Requiring each directory to exist
          # AND yield at least one script closes that gap, and dropping
          # `2>/dev/null` makes a future `find` failure loud instead of empty.
          for d in .claude/hooks .github/scripts; do
            if [ ! -d "$d" ]; then
              echo "::error::expected script directory $d is missing (renamed or moved?) - discovery cannot proceed without it"
              fail=1
              continue
            fi
            count=$(find -L "$d" -maxdepth 1 -name '*.sh' -type f | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::expected script directory $d contains zero *.sh files - discovery is broken, or the directory was emptied"
              fail=1
            fi
            # `find -L` (Finding 7) follows a symlink to discover it like a
            # real file, but a DANGLING symlink still silently vanishes: `-L`
            # dereferences before testing `-type f`, and a broken target
            # fails that test the same way a plain wrong-typed entry would,
            # with no error printed (PR #350 review round 2, R2-3). The
            # per-directory `count` check above doesn't catch it either,
            # since real files keep the count above zero. `-xtype l` finds
            # exactly the entries that ARE a symlink but whose `-L`-resolved
            # type is NOT what it claims - i.e. broken links - independent
            # of whether anything else in the directory is healthy.
            broken=$(find "$d" -maxdepth 1 -name '*.sh' -xtype l)
            if [ -n "$broken" ]; then
              echo "::error::dangling symlink(s) under $d: $broken"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          files=$(find -L .claude/hooks .github/scripts -maxdepth 1 -name '*.sh' -type f | sort)

          while IFS= read -r f; do
            echo "::group::--selftest $f"
            out=$(mktemp)
            # `timeout` + `</dev/null`: a liveness check must live OUTSIDE
            # the thing whose liveness is in question — a hook whose
            # --selftest hangs (e.g. falls through to a stdin-reading
            # production path because it never learned to recognise the
            # flag) must not hang this JOB. 60s is generous headroom over
            # notices-nudge.sh's own ~504-shape selftest.
            if timeout 60 bash "$f" --selftest </dev/null >"$out" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            cat "$out"
            # Require BOTH exit 0 AND the literal "SELFTEST OK" marker every
            # one of these scripts prints on success. Exit 0 alone is not
            # proof the script understood --selftest: a script with no
            # --selftest branch at all could fall through to a production
            # no-op and exit 0 too — exactly the "check that structurally
            # cannot fail" this issue exists to close, so the marker is
            # required in addition to, not instead of, the exit code.
            if [ "$rc" -eq 0 ] && grep -q '^SELFTEST OK$' "$out"; then
              echo "OK: $f"
            else
              echo "::error::$f --selftest FAILED (exit $rc, or missing the SELFTEST OK marker) - see the log above"
              fail=1
            fi
            echo "::endgroup::"
            rm -f "$out"
          done <<< "$files"

          exit "$fail"
