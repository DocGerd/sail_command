name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  # Cancel superseded runs on PRs only; pushes to main always run to completion.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Drift guard: a dependency bump that forgets to regenerate the
      # committed third-party notices fails CI. Pathspec is relative to the
      # job's working-directory (app/).
      - run: npm run notices
      - run: git diff --exit-code public/THIRD-PARTY-NOTICES.txt
  # Deliberately no `needs: app` edge. The e2e job is self-contained: its
  # `pree2e` hook rebuilds the app from scratch, so no artifact flows from the
  # `app` job. Running the two jobs concurrently rather than gated saves ~120s
  # of wall clock on every run, which compounds because `app`+`e2e` are both
  # required checks under a strict up-to-date branch policy — every merge in a
  # train pays a full CI cycle. Trade-off: a PR whose unit tests fail in `app`
  # now also burns e2e runner minutes instead of skipping them.
  # `app` and `e2e` also share an npm cache key (setup-node's `cache: npm` +
  # `cache-dependency-path: app/package-lock.json` above): now that the two
  # jobs start concurrently instead of `e2e` waiting on `app`, a
  # lockfile-changing PR may have `e2e` restore a cache miss (the two runners
  # race to populate the same cache key) and pay an uncached `npm ci`
  # (~5-6s). Accepted knowingly (#214) — the ~120s saved on every run
  # outweighs a few extra seconds on lockfile-changing PRs only.
  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the classify step below diffs the PR's base SHA
          # against its head SHA. A default depth-1 clone only holds the
          # merge-ref tip, so the base commit is unreachable and the diff
          # can't run — see the classify step's fail-closed default (#327).
          fetch-depth: 0
      # `e2e` is a REQUIRED status check under `protect-main` with a strict
      # up-to-date policy, so it must always run this job and always report
      # — a trigger-level `paths:`/`paths-ignore:` filter would make the
      # check never report at all on a skipped PR, blocking the PR forever.
      # Instead this classify step decides whether the PR's diff is
      # docs-only, and only the EXPENSIVE steps below are `if:`-gated on the
      # result; the job itself always completes and reports success (#327).
      - name: Classify change (docs-only vs. code) — fail-closed to RUN
        id: classify
        # Not under the job's `app`-relative default: path strings here must
        # stay unambiguously repo-root-relative to match the docs allowlist.
        working-directory: ${{ github.workspace }}
        # Pass templated context through env (not inlined into the script) so
        # nothing from the event payload is interpolated directly into a
        # shell command.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # FAIL-CLOSED DEFAULT. This is a BLOCKING guard: the wrong-direction
          # failure is a code PR silently skipping e2e and reporting green,
          # which is far worse than a docs PR paying ~10 minutes it didn't
          # need to (which just costs time). So any ambiguity — a non-PR
          # event, an unreadable base/head commit (shallow clone, merge
          # queue, force-push), a failing `git diff`, or an empty
          # changed-file list — defaults to RUN, explicitly, not by accident
          # of how an expression happens to evaluate.
          run_e2e=true
          reason="not a pull_request event"

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base_sha="${BASE_SHA}"
            head_sha="${HEAD_SHA}"

            if git cat-file -e "${base_sha}^{commit}" 2>/dev/null \
              && git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then

              # Two-dot diff, not three-dot: two-dot needs no merge-base, so
              # it survives a shallow/partial object store, and a stale or
              # over-broad base only ever ADDS files to the changed set —
              # the safe direction for a fail-closed check. `--no-renames`
              # so a code file renamed INTO docs/ still shows its origin
              # path and isn't misclassified as docs-only.
              changed="$(git diff --no-renames --name-only "${base_sha}" "${head_sha}")"
              diff_status=$?

              if [ "${diff_status}" -ne 0 ]; then
                run_e2e=true
                reason="git diff failed (exit ${diff_status})"
              elif [ -z "${changed}" ]; then
                run_e2e=true
                reason="empty changed-file list"
              else
                run_e2e=false
                reason="all changed paths matched the docs allowlist"
                while IFS= read -r f; do
                  [ -z "$f" ] && continue
                  case "$f" in
                    CHANGELOG.md|README.md|ROADMAP.md|GOVERNANCE.md|CONTRIBUTING.md|SECURITY.md|CODE_OF_CONDUCT.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md|changelog.d/*)
                      ;;
                    *)
                      # Record only the FIRST path that forces a run — do
                      # not overwrite once already true (an unlisted path
                      # is code, never docs, per #327's definition of done).
                      if [ "${run_e2e}" != "true" ]; then
                        run_e2e=true
                        reason="non-docs path: ${f}"
                      fi
                      ;;
                  esac
                done <<< "${changed}"
              fi
            else
              run_e2e=true
              reason="base or head commit unreachable (shallow clone / merge-queue / force-push)"
            fi
          fi

          # Log to stdout too, not just $GITHUB_OUTPUT/$GITHUB_STEP_SUMMARY —
          # a misclassification six months from now needs the WHY in the
          # plain job log, not only in machine-readable outputs that don't
          # show up in `gh run view --log`. Name the value, not a boolean
          # (this repo has paid for a boolean-only assertion twice already).
          echo "changed paths:"
          printf '%s\n' "${changed:-<none>}"
          echo "run_e2e=${run_e2e} reason=${reason}"

          echo "run_e2e=${run_e2e}" >> "$GITHUB_OUTPUT"
          {
            echo "### e2e classification"
            echo "- run_e2e: **${run_e2e}**"
            echo "- reason: ${reason}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.classify.outputs.run_e2e == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        if: steps.classify.outputs.run_e2e == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.classify.outputs.run_e2e == 'true'
      - run: npm run e2e
        if: steps.classify.outputs.run_e2e == 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
