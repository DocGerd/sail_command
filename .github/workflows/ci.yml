name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  # Cancel superseded runs on PRs only - `cancel-in-progress` here governs
  # only an already-RUNNING run, never a merely QUEUED one, so "pushes to
  # main/develop always run to completion" is an OVER-CLAIM (the same one
  # #900's review corrected in codeql.yml's twin comment). On the default
  # `queue: single` (this workflow sets no `queue:` property), GitHub caps
  # PENDING runs at one per group: "By default, any existing `pending` job
  # or workflow in the same concurrency group will be canceled and the new
  # queued job or workflow will take its place." (docs.github.com,
  # "workflow-syntax" reference, #concurrency section, fetched and matched
  # as an exact substring 2026-09-03 - the sentence renders there but was
  # not locatable in any github/docs@main source file, so cite the rendered
  # page rather than a file path that does not exist). So two pushes to the
  # SAME branch queued close together (this group is `ci-${{ github.ref }}`,
  # branch-specific for push events) can drop the earlier-queued one before
  # it ever starts, even though push events never set
  # `cancel-in-progress: true`. See CLAUDE.md's own `ci.yml`'s concurrency
  # group bullet for the measured same-ref queuing/wedge behavior this
  # composes with.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # #1286: `app` and `e2e` are each a FAN-IN over sharded jobs. Both names are
  # REQUIRED checks under `protect-main`'s strict policy, so the fan-ins keep
  # those exact names, always run (`if: always()`), and fail unless EVERY
  # needed job reports `success`. Shard jobs never skip at the job level: the
  # docs-only (#327/#875) and unchanged-tree (#877) gates skip their STEPS,
  # so a skipped path still ends `success` and the fan-in needs no
  # "legitimately skipped" branch. A failed `changes` job skips its
  # dependents (result `skipped`), which the fan-in reads as red.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The #877 retest classifier reads check-run and workflow-run state. An
    # explicit `permissions:` block zeroes every unlisted scope, so this job
    # declares its own rather than inheriting `contents: read` alone.
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      run_app: ${{ steps.classify.outputs.run_app }}
      run_e2e: ${{ steps.classify.outputs.run_e2e }}
      retest_app: ${{ steps.retest_app.outputs.retest }}
      retest_e2e: ${{ steps.retest_e2e.outputs.retest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the docs-only classifier diffs a PR's base against
          # its head, and the #877 classifier reads a push commit's second
          # parent and its tree. A depth-1 clone makes both unreachable.
          fetch-depth: 0
      # Privacy guard (#474): fails on any tracked file leaking an absolute
      # home-directory path. Ungated, so it covers docs-only PRs too (docs are
      # where it leaked, commit e5358d4). It runs here, once, so a leak now
      # reds BOTH required checks via the fan-ins.
      - name: No leaked home paths (#474)
        run: bash .github/scripts/check-no-home-paths.sh
      # Docs-only classifier (#327, #875). Writes `run_e2e` and `run_app`;
      # `run_app`'s skip set is a strict subset (CHANGELOG.md/changelog.d/*
      # are build inputs), see the script header. `bash -e` is load-bearing:
      # a bare script path execs a new bash that does not inherit errexit
      # (PR #350 review, Finding 1).
      - name: Classify change (docs-only vs. code)
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash -e .github/scripts/classify-docs-only.sh
      # #877: skip re-testing a push whose tree equals an already-tested PR
      # head. CHECK_NAME is the FAN-IN check-run name the script looks up on
      # the second parent (`app`/`e2e`), so the fan-ins keep that contract.
      # `push` only; every `pull_request` run gets `retest=true`.
      - name: Classify skip-retest for app (#877)
        id: retest_app
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          CHECK_NAME: app
          GH_TOKEN: ${{ github.token }}
        run: bash -e .github/scripts/classify-retest.sh
      - name: Classify skip-retest for e2e (#877)
        id: retest_e2e
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          CHECK_NAME: e2e
          GH_TOKEN: ${{ github.token }}
        run: bash -e .github/scripts/classify-retest.sh
  # Lint, typecheck, the #537 sweep unit tests, build and the notices drift
  # guard run ONCE here, concurrently with the vitest shards.
  app-static:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: app } }
    # Fail-closed polarity (PR #350 review, Finding 1): SKIP only on an
    # explicit 'false' from either classifier; an empty/absent output RUNS.
    env:
      SKIP: ${{ needs.changes.outputs.run_app == 'false' || needs.changes.outputs.retest_app == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'
        with:
          # Full history keeps the build's `git describe` version string
          # identical to the pre-#1286 single job.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SKIP != 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        if: env.SKIP != 'true'
      - run: npm run lint
        if: env.SKIP != 'true'
      - run: npm run typecheck
        if: env.SKIP != 'true'
      # #537/#1262: plain `node --test` over app/sweep/'s unit files, which
      # vite.config.ts's `include` never collects; the arm sweep itself stays
      # on-demand.
      - run: npm run test:sweep-unit
        if: env.SKIP != 'true'
      - run: npm run build
        if: env.SKIP != 'true'
      # Drift guard: a dependency bump that forgets to regenerate the
      # committed third-party notices fails CI.
      - run: npm run notices
        if: env.SKIP != 'true'
      - run: git diff --exit-code public/THIRD-PARTY-NOTICES.txt
        if: env.SKIP != 'true'
  # Vitest across three runners. `SlowFileFirstSequencer.shard()`
  # (app/vite.config.ts) spreads SLOW_TEST_FILES_FIRST round-robin; every
  # other file splits by BaseSequencer's root-relative path hash.
  app-shard:
    name: app-shard (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    runs-on: ubuntu-latest
    # #882 capped the unsharded job at 45 min over a 1557 s max. Measured
    # slowest shard 10m07s (run 35199641189), so 30 min is ~3x.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults: { run: { working-directory: app } }
    env:
      SKIP: ${{ needs.changes.outputs.run_app == 'false' || needs.changes.outputs.retest_app == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SKIP != 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        if: env.SKIP != 'true'
      - run: npm run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        if: env.SKIP != 'true'
  app:
    name: app
    needs: [changes, app-static, app-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A matrix job's `needs.<id>.result` is the aggregate: `failure` if any
      # shard failed, `cancelled` if cancelled. The length check stops an
      # empty or renamed `needs` map from reading green.
      - name: Require every app job to succeed (#1286)
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: 3
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          count=$(printf '%s' "$NEEDS" | jq 'length')
          bad=$(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(" ")')
          if [ "$count" != "$EXPECTED" ]; then
            echo "::error::expected $EXPECTED needed jobs, got $count"; exit 1
          fi
          if [ -n "$bad" ]; then
            echo "::error::not successful: $bad"; exit 1
          fi
  # No `needs` edge between the app and e2e trees: `pree2e` rebuilds the app,
  # so nothing flows between them and both run concurrently (#214). Accepted
  # trade: a unit-test red still burns e2e minutes.
  e2e-shard:
    name: e2e-shard (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    runs-on: ubuntu-latest
    # #605 capped the unsharded job at 30 min to turn install wedges into a
    # fast red. Shard 1 carries all of layout.spec.ts: measured 12m57s green
    # (run 35199641189) and 16m59s on a slow runner (run 35195770591), so
    # 35 min is 2.7x / 2.06x.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults: { run: { working-directory: app } }
    env:
      SKIP: ${{ needs.changes.outputs.run_e2e == 'false' || needs.changes.outputs.retest_e2e == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SKIP != 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        if: env.SKIP != 'true'
      # Browser cache keyed on the exact lockfile @playwright/test version.
      # It removes only the DOWNLOAD half of #605's install wedges: the apt
      # half (`install-deps`) still runs on every shard.
      - name: Resolve Playwright version
        id: pw
        if: env.SKIP != 'true'
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::bad Playwright version '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        if: env.SKIP != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
        if: env.SKIP != 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: env.SKIP != 'true'
      # Each shard runs its own `pree2e` build, so #803's build-identity
      # checks hold per runner. The `identity` dependency project runs in
      # full on every shard (Playwright re-adds dependencies after sharding).
      - run: npm run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        if: env.SKIP != 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: app/playwright-report/
          retention-days: 7
  e2e:
    name: e2e
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every e2e job to succeed (#1286)
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: 2
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          count=$(printf '%s' "$NEEDS" | jq 'length')
          bad=$(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(" ")')
          if [ "$count" != "$EXPECTED" ]; then
            echo "::error::expected $EXPECTED needed jobs, got $count"; exit 1
          fi
          if [ -n "$bad" ]; then
            echo "::error::not successful: $bad"; exit 1
          fi
  # Non-required (#334; NOT added to `protect-main`'s required checks, same
  # treatment as the coverage job in #319 — and per `mergeable_state:
  # unstable`'s meaning in this repo, "only optional checks are red" is still
  # mergeable, so this job RUNS coverage and turns a broken selftest into a
  # visible red check, but does not itself GATE the merge). Several
  # `.claude/hooks/*.sh` scripts, and now `.github/scripts/classify-docs-only.sh`,
  # carry a `--selftest` mode with real coverage — but nothing ran any of them
  # automatically before this job, so a hook could be broken by an edit to a
  # DIFFERENT file (or an environment change) and every check would stay
  # green. Discovers scripts rather than hardcoding a list — a hardcoded list
  # silently misses the next hook added, the same enumerate-don't-patch
  # principle applied elsewhere in this repo to prose.
  hook-selftests:
    # #882: no cap before now (360-min default). Measured 2026-09-03 via the
    # Actions API against the 30 most recent runs: max 22s (n=30, all
    # success) — a "cheap insurance" job per #882's own bucket, sized at
    # 10-15 min rather than a tight multiple of a sub-minute median.
    timeout-minutes: 10
    # DO NOT add `defaults: { run: { working-directory: ... } }` to this job
    # (PR #350 review, pre-existing-but-now-relevant finding). This job has
    # no `defaults`, so its steps run at the checkout root — repo-root
    # relative paths like `.claude/hooks` resolve correctly, AND
    # `wind-fixture-guard.sh --selftest` (unrelated to this PR) is
    # cwd-sensitive: it reads `${CLAUDE_PROJECT_DIR:-.}/.claude/settings.json`
    # relative to `.`, so it only passes today because `.` happens to be the
    # repo root here. Setting a `working-directory` (e.g. `app`, to mirror
    # the `app`/`e2e` jobs) would silently turn that hook's selftest red
    # without touching a single line of its own logic - a landmine for the
    # next person who "tidies" this job to match the others.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Discover and run every --selftest suite
        run: |
          set -uo pipefail
          fail=0

          # Discover rather than hardcode (#334): both directories currently
          # hold hand-authored shell that is invoked by name from
          # `.claude/settings.json` or `ci.yml` respectively, and both are
          # small enough (5 files total today) that walking them on every
          # run costs nothing. `-maxdepth 1` deliberately does not recurse —
          # neither directory nests scripts today, and a future nested
          # script should be a conscious addition to this job, not a silent
          # pickup. `find -L` follows symlinks so a symlinked hook is
          # discovered like a real file (PR #350 review, Finding 7) —
          # plain `-type f` silently excludes a symlink even though it's
          # exactly the kind of "next hook added" this job exists to catch.
          #
          # Each directory is checked INDIVIDUALLY, not just the combined
          # result (PR #350 review, Finding 2): a bare
          # `find A B ... 2>/dev/null | sort` swallows `find`'s error when
          # ONE of the two directories is missing/renamed, and the surviving
          # directory alone keeps `$files` non-empty — so a zero-files guard
          # on the COMBINED list only fires when BOTH directories vanish at
          # once, silently running with partial coverage (e.g. 1 of 5
          # scripts) the rest of the time. Requiring each directory to exist
          # AND yield at least one script closes that gap, and dropping
          # `2>/dev/null` makes a future `find` failure loud instead of empty.
          for d in .claude/hooks .github/scripts; do
            if [ ! -d "$d" ]; then
              echo "::error::expected script directory $d is missing (renamed or moved?) - discovery cannot proceed without it"
              fail=1
              continue
            fi
            count=$(find -L "$d" -maxdepth 1 -name '*.sh' -type f | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::expected script directory $d contains zero *.sh files - discovery is broken, or the directory was emptied"
              fail=1
            fi
            # `find -L` (Finding 7) follows a symlink to discover it like a
            # real file, but a DANGLING symlink still silently vanishes: `-L`
            # dereferences before testing `-type f`, and a broken target
            # fails that test the same way a plain wrong-typed entry would,
            # with no error printed (PR #350 review round 2, R2-3). The
            # per-directory `count` check above doesn't catch it either,
            # since real files keep the count above zero. `-xtype l` finds
            # exactly the entries that ARE a symlink but whose `-L`-resolved
            # type is NOT what it claims - i.e. broken links - independent
            # of whether anything else in the directory is healthy.
            broken=$(find "$d" -maxdepth 1 -name '*.sh' -xtype l)
            if [ -n "$broken" ]; then
              echo "::error::dangling symlink(s) under $d: $broken"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          files=$(find -L .claude/hooks .github/scripts -maxdepth 1 -name '*.sh' -type f | sort)

          while IFS= read -r f; do
            echo "::group::--selftest $f"
            out=$(mktemp)
            # `timeout` + `</dev/null`: a liveness check must live OUTSIDE
            # the thing whose liveness is in question — a hook whose
            # --selftest hangs (e.g. falls through to a stdin-reading
            # production path because it never learned to recognise the
            # flag) must not hang this JOB. 60s is generous headroom over
            # notices-nudge.sh's own ~504-shape selftest.
            if timeout 60 bash "$f" --selftest </dev/null >"$out" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            cat "$out"
            # Require BOTH exit 0 AND the literal "SELFTEST OK" marker every
            # one of these scripts prints on success. Exit 0 alone is not
            # proof the script understood --selftest: a script with no
            # --selftest branch at all could fall through to a production
            # no-op and exit 0 too — exactly the "check that structurally
            # cannot fail" this issue exists to close, so the marker is
            # required in addition to, not instead of, the exit code.
            if [ "$rc" -eq 0 ] && grep -q '^SELFTEST OK$' "$out"; then
              echo "OK: $f"
            else
              echo "::error::$f --selftest FAILED (exit $rc, or missing the SELFTEST OK marker) - see the log above"
              fail=1
            fi
            echo "::endgroup::"
            rm -f "$out"
          done <<< "$files"

          exit "$fail"
