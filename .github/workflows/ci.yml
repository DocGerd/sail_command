name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  # Cancel superseded runs on PRs only; pushes to main always run to completion.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Drift guard: a dependency bump that forgets to regenerate the
      # committed third-party notices fails CI. Pathspec is relative to the
      # job's working-directory (app/).
      - run: npm run notices
      - run: git diff --exit-code public/THIRD-PARTY-NOTICES.txt
  # Deliberately no `needs: app` edge. The e2e job is self-contained: its
  # `pree2e` hook rebuilds the app from scratch, so no artifact flows from the
  # `app` job. Running the two jobs concurrently rather than gated saves ~120s
  # of wall clock on every run, which compounds because `app`+`e2e` are both
  # required checks under a strict up-to-date branch policy — every merge in a
  # train pays a full CI cycle. Trade-off: a PR whose unit tests fail in `app`
  # now also burns e2e runner minutes instead of skipping them.
  # `app` and `e2e` also share an npm cache key (setup-node's `cache: npm` +
  # `cache-dependency-path: app/package-lock.json` above): now that the two
  # jobs start concurrently instead of `e2e` waiting on `app`, a
  # lockfile-changing PR may have `e2e` restore a cache miss (the two runners
  # race to populate the same cache key) and pay an uncached `npm ci`
  # (~5-6s). Accepted knowingly (#214) — the ~120s saved on every run
  # outweighs a few extra seconds on lockfile-changing PRs only.
  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the classify step below diffs the PR's base SHA
          # against its head SHA. A default depth-1 clone only holds the
          # merge-ref tip, so the base commit is unreachable and the diff
          # can't run — see the classify step's fail-closed default (#327).
          fetch-depth: 0
      # `e2e` is a REQUIRED status check under `protect-main` with a strict
      # up-to-date policy, so it must always run this job and always report
      # — a trigger-level `paths:`/`paths-ignore:` filter would make the
      # check never report at all on a skipped PR, blocking the PR forever.
      # Instead this classify step decides whether the PR's diff is
      # docs-only, and only the EXPENSIVE steps below are `if:`-gated on the
      # result; the job itself always completes and reports success (#327).
      - name: Classify change (docs-only vs. code) — fail-closed to RUN
        id: classify
        # Not under the job's `app`-relative default: path strings here must
        # stay unambiguously repo-root-relative to match the docs allowlist.
        working-directory: ${{ github.workspace }}
        # Pass templated context through env (not inlined into the script) so
        # nothing from the event payload is interpolated directly into a
        # shell command.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Extracted to .github/scripts/classify-docs-only.sh (#334) so the
        # decision logic carries committed test coverage (a 33-case adversarial
        # harness runnable offline via `--selftest`) instead of living only as
        # untested inline YAML shell — see that script's header for the full
        # rationale and the fail-closed contract it preserves byte-for-byte.
        run: .github/scripts/classify-docs-only.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.classify.outputs.run_e2e == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        if: steps.classify.outputs.run_e2e == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.classify.outputs.run_e2e == 'true'
      - run: npm run e2e
        if: steps.classify.outputs.run_e2e == 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
  # Non-required (#334; NOT added to `protect-main`'s required checks, same
  # treatment as the coverage job in #319). Several `.claude/hooks/*.sh`
  # scripts, and now `.github/scripts/classify-docs-only.sh`, carry a
  # `--selftest` mode with real coverage — but nothing ran any of them
  # automatically before this job, so a hook could be broken by an edit to a
  # DIFFERENT file (or an environment change) and every check would stay
  # green. Discovers scripts rather than hardcoding a list — a hardcoded list
  # silently misses the next hook added, the same enumerate-don't-patch
  # principle applied elsewhere in this repo to prose — and FAILS if a
  # discovered script has no working `--selftest`, so the convention is
  # enforced rather than aspirational.
  hook-selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Discover and run every --selftest suite
        run: |
          set -uo pipefail
          fail=0

          # Discover rather than hardcode (#334): both directories currently
          # hold hand-authored shell that is invoked by name from
          # `.claude/settings.json` or `ci.yml` respectively, and both are
          # small enough (5 files total today) that walking them on every
          # run costs nothing. `-maxdepth 1` deliberately does not recurse —
          # neither directory nests scripts today, and a future nested
          # script should be a conscious addition to this job, not a silent
          # pickup.
          files=$(find .claude/hooks .github/scripts -maxdepth 1 -name '*.sh' -type f 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "::error::discovery found zero *.sh files under .claude/hooks or .github/scripts - discovery itself is broken (expected at least the wind-fixture/artifact/notices/premerge hooks and the docs-only classifier)"
            exit 1
          fi

          while IFS= read -r f; do
            echo "::group::--selftest $f"
            out=$(mktemp)
            # `timeout` + `</dev/null`: a liveness check must live OUTSIDE
            # the thing whose liveness is in question — a hook whose
            # --selftest hangs (e.g. falls through to a stdin-reading
            # production path because it never learned to recognise the
            # flag) must not hang this JOB. 60s is generous headroom over
            # notices-nudge.sh's own ~504-shape selftest.
            if timeout 60 bash "$f" --selftest </dev/null >"$out" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            cat "$out"
            # Require BOTH exit 0 AND the literal "SELFTEST OK" marker every
            # one of these scripts prints on success. Exit 0 alone is not
            # proof the script understood --selftest: a script with no
            # --selftest branch at all could fall through to a production
            # no-op and exit 0 too — exactly the "check that structurally
            # cannot fail" this issue exists to close, so the marker is
            # required in addition to, not instead of, the exit code.
            if [ "$rc" -eq 0 ] && grep -q '^SELFTEST OK$' "$out"; then
              echo "OK: $f"
            else
              echo "::error::$f --selftest FAILED (exit $rc, or missing the SELFTEST OK marker) - see the log above"
              fail=1
            fi
            echo "::endgroup::"
            rm -f "$out"
          done <<< "$files"

          exit "$fail"
