name: Labeler
# pull_request_target (not pull_request) because Dependabot-triggered
# pull_request runs get a forced READ-ONLY GITHUB_TOKEN regardless of the
# permissions: block below (GitHub treats them like fork PRs) — and
# Dependabot is this repo's dominant PR source, so plain pull_request would
# silently label almost nothing. Safe here specifically because this
# workflow never checks out or executes PR-head-controlled code (no
# actions/checkout step; actions/labeler reads the changed-file list via the
# GitHub API), so running with base-repo permissions/secrets carries none of
# pull_request_target's usual "runs attacker code with write access" risk.
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    # #882: no cap before now (360-min default). Measured 2026-09-03 via the
    # Actions API against the 30 most recent runs: max 11s (n=29, all
    # success) — a "cheap insurance" job per #882's own bucket, sized at
    # 10-15 min rather than a tight multiple of that sub-minute median.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
