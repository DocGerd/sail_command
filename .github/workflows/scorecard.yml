name: Scorecard
on:
  # #883: scorecard is NOT a required check (protect-main requires app+e2e
  # only, verified against ruleset 19043136 2026-09-07), so scoping this
  # push trigger is safe here in a way it never would be on app/e2e — a
  # skipped run simply does not report. Paths cover every pinned-dependency
  # artifact Pinned-Dependencies/Dangerous-Workflow/Token-Permissions read
  # (enumerated 2026-09-07: app/package-lock.json, pipeline/package-lock.json
  # via '**/package-lock.json'; pipeline/requirements.txt explicitly;
  # .github/workflows/python-lint-requirements.txt and
  # .github/workflows/verify-mask-requirements.txt via '.github/**') plus
  # '.github/**' generally for any workflow-file change. Commit-activity-based
  # checks are still re-evaluated by the weekly schedule below, so scoping
  # this trigger loses nothing durable from them.
  push:
    branches: [develop]
    paths:
      - '.github/**'
      - '**/package-lock.json'
      - 'pipeline/requirements.txt'
  schedule:
    - cron: '30 3 * * 1' # weekly, Monday 03:30 UTC
  branch_protection_rule:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    # #882: no cap before now (360-min default). Measured 2026-09-03 via the
    # Actions API against the 30 most recent runs: max 55s (n=30, all
    # success) — a "cheap insurance" job per #882's own bucket, sized at
    # 10-15 min rather than a tight multiple of that sub-minute median; 15
    # (not 10) for the external OSSF API round-trip (`publish_results`)
    # this job makes, which this repo does not control the latency of.
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write        # publish_results signed attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
