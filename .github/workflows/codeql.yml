name: CodeQL
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday 04:23 UTC
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # #534: maintainer chose the BROADEST built-in suite over the
          # default. `queries:` is a single field on this shared step (not
          # templated per matrix.language like `languages`/`build-mode`
          # above), so it applies UNIFORMLY to BOTH matrix legs -
          # javascript-typescript AND python each resolve their own
          # language-specific `security-and-quality.qls` - deliberately,
          # not as an accident of the matrix shape. For JS/TS this is NOT
          # the generic `security-and-quality-selectors.yml`: it is the
          # security-extended selectors plus an explicit allowlist of 102
          # additional non-security query IDs, reachable only via this
          # advanced-setup `queries:` key (already in use here). CodeQL is
          # NOT a required check (`protect-main` requires only `app` +
          # `e2e`), so new alerts accumulate in the Security tab rather
          # than blocking merges - triage the first post-widen scan
          # rather than assuming silence means nothing new fired.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: '/language:${{ matrix.language }}'
