name: CodeQL
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # No `paths:` filter: Scorecard's SAST check counts commits whose PR head has
    # no CodeQL run, so a filter skipping prose-only PRs lowers that score (#72).
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday 04:23 UTC
permissions:
  contents: read
# #880: mirrors ci.yml's group/cancel-in-progress shape (same ref key, same
# event_name condition) so the two workflows cannot drift apart in intent.
# cancel-in-progress fires ONLY for pull_request events, so a RUNNING
# push/schedule analysis is never pre-empted mid-run by a later push or
# schedule trigger. That is narrower than "push/schedule analyses always
# run to completion uncancelled", though: GitHub's concurrency groups allow
# only ONE run PENDING (queued, not yet started) per group regardless of
# cancel-in-progress - if a develop push and the weekly schedule (which
# also runs against the default branch, so it shares this same
# codeql-refs/heads/develop group) both end up queued while an earlier run
# in that group is still executing, only the LATER-queued one survives and
# the other is cancelled before it ever starts. That is new behaviour this
# key introduces (codeql.yml previously had no concurrency block at all),
# not a defect: at most one push/schedule analysis is lost to a same-ref
# collision, and the next push or the following Monday's schedule
# re-covers the same ground. The PR-scoped cancellation this key exists
# for - superseding a dead PR head instead of analysing it to completion -
# is unaffected either way. The group key includes github.ref so one PR's
# push never collides with a different PR's in-flight analysis.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # #882: no cap before now (360-min default). Measured 2026-09-03 via the
    # Actions API against the 30 most recent runs of EACH matrix leg:
    # javascript-typescript max 108s, python max 60s (n=30 each, all
    # success) — this key applies uniformly to both legs (see the `queries:`
    # comment below on why that is deliberate, not a matrix accident). Sized
    # well above the sub-minute measured max to leave headroom for the
    # `security-and-quality` query-pack widening (#534) growing further on a
    # future codeql-action/query-pack bump this repo does not control.
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # #534: maintainer chose the BROADEST built-in suite over the
          # default. `queries:` is a single field on this shared step (not
          # templated per matrix.language like `languages`/`build-mode`
          # above), so it applies UNIFORMLY to BOTH matrix legs -
          # javascript-typescript AND python each resolve their own
          # language-specific `security-and-quality.qls` - deliberately,
          # not as an accident of the matrix shape. For JS/TS this is NOT
          # the generic `security-and-quality-selectors.yml`: as of CodeQL
          # CLI 2.26.3 (this repo's own PR #588 Actions run, 2026-08-19),
          # it is the security-extended selectors plus an allowlist of 102
          # additional non-security query IDs named in that bundle's own
          # `.qls` file at the time - a snapshot of a GitHub-maintained
          # bundle this repo does not pin or control, so the count can
          # drift on any future codeql-action/query-pack bump with nothing
          # here to catch it; re-derive rather than trust it. Measured
          # against this repo's BASE commit's own UNSCOPED push run (the
          # default suite, before this diff's `queries:` widening):
          # javascript-typescript went from 89 to 203 total rules (+114, 98
          # of them outside the `Security/` query category - i.e. most of
          # the widening is quality/maintainability rules, not new security
          # coverage); python went from 45 to 174 total rules (+129). Both
          # counts are consistent with, though not a re-proof of, the
          # 102-query breakdown above. `queries:` is reachable because ADVANCED
          # SETUP (explicit init+analyze steps, not GitHub's simplified
          # default-setup UI toggle) is already in use in this workflow -
          # this diff adds the `queries:` key itself, not the setup mode
          # that makes it reachable. A `pull_request` run proves NOTHING
          # about this widening: the action builds a `pr-diff-range`
          # extension pack and passes it to `database run-queries`, so
          # alerts are restricted to the changed lines (measured on this
          # PR's own run, both matrix legs: "Persisted 14 diff range(s)
          # across 5 file(s)", `--extension-packs=codeql-action/pr-diff-
          # range`). Only an unscoped `push`/`schedule` scan on develop
          # exercises the new queries repo-wide. CodeQL is also NOT a
          # required check (`protect-main` requires only `app` + `e2e`),
          # so whatever that first post-widen scan finds accumulates in
          # the Security tab rather than blocking merges - triage it
          # explicitly; a green CodeQL check on any PR, this one included,
          # says nothing about what the widened suite finds repo-wide.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: '/language:${{ matrix.language }}'
