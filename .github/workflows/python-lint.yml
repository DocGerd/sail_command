name: Python lint

# #220: standalone workflow, deliberately separate from ci.yml. The `app`
# and `e2e` jobs in ci.yml are the ONLY required checks under the
# protect-main ruleset (strict up-to-date policy) — this job is NOT added
# to that ruleset, so it must fail closed (report a red job) without ever
# blocking a merge. A step inside `app` would also mean a Python-only PR
# never runs this at all, since `app` triggers `working-directory: app`.
on:
  pull_request:
    paths:
      - 'pipeline/**.py'
      - 'pipeline/pyproject.toml'
      - '.github/workflows/python-lint.yml'
      - '.github/workflows/python-lint-requirements.txt'
  push:
    branches: [main, develop]
    paths:
      - 'pipeline/**.py'
      - 'pipeline/pyproject.toml'
      - '.github/workflows/python-lint.yml'
      - '.github/workflows/python-lint-requirements.txt'
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    # #882: no cap before now (360-min default). Measured 2026-09-03 via the
    # Actions API against the 30 most recent runs: max 21s (n=30, all
    # success) — a "cheap insurance" job per #882's own bucket, sized at
    # 10-15 min rather than a tight multiple of that sub-minute median.
    timeout-minutes: 10
    defaults: { run: { working-directory: pipeline } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install --require-hashes -r "$GITHUB_WORKSPACE/.github/workflows/python-lint-requirements.txt"
      - run: ruff check .
      - run: ruff format --check .
